services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PRIMARY_HOST: db
      DB_REPLICA_HOST: db
      DB_PORT: "5432"
      DB_REPLICA_PORT: "5432"
      DB_NAME: sfmshop
      DB_USER: postgres
      DB_PASSWORD: user
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sfmshop

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sfmshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sfmshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sfmshop

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sfmshop

networks:
  sfmshop:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
