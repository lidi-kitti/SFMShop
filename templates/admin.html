<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>SFMShop - Админ-панель</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 max-width: 600px;
 margin: 50px auto;
 padding: 20px;
 }

 h1, h2 {
 color: #333;
 text-align: center;
 }

 form {
 background-color: #f5f5f5;
 padding: 20px;
 border-radius: 5px;
 margin-bottom: 20px;
 }

 label {
 display: block;
 margin-bottom: 5px;
 font-weight: bold;
 }

 input {
 width: 100%;
 padding: 8px;
 margin-bottom: 15px;
 border: 1px solid #ddd;
 border-radius: 3px;
 box-sizing: border-box;
 }

 button {
 background-color: #4CAF50;
 color: white;
 padding: 10px 20px;
 border: none;
 border-radius: 3px;
 cursor: pointer;
 }

 button:hover {
 background-color: #45a049;
 }

 #message {
 margin-top: 20px;
 padding: 10px;
 border-radius: 3px;
 }

 .success {
 background-color: #d4edda;
 color: #155724;
 }

 .error {
 background-color: #f8d7da;
 color: #721c24;
 }

 #getProductsBtn {
 margin-top: 20px;
 }

 #productsList {
 margin-top: 15px;
 }
 </style>
</head>
<body>
 <h1>Админ-панель SFMShop</h1>

 <h2>Вход (JWT)</h2>
 <form id="loginForm">
 <label for="username">Логин:</label>
 <input type="text" id="username" name="username" required minlength="3">

 <label for="password">Пароль:</label>
 <input type="password" id="password" name="password" required minlength="8">

 <button type="submit">Получить токен</button>
 </form>

 <h2>Новый товар</h2>
 <form id="productForm">
 <label for="name">Название товара:</label>
 <input type="text" id="name" name="name" required>

 <label for="price">Цена:</label>
 <input type="number" id="price" name="price" step="0.01" min="0.01" required>

 <label for="stock">Количество на складе:</label>
 <input type="number" id="stock" name="stock" min="0" required>

 <button type="submit">Добавить товар</button>
 </form>

 <div id="message"></div>

 <button type="button" id="getProductsBtn">Получить список товаров</button>
 <div id="productsList"></div>

 <script>
 const API_BASE = window.location.protocol === "file:" ? "http://localhost:8000" : "";
 const TOKEN_KEY = "sfmshop_access_token";

 function apiUrl(path) {
  return API_BASE + path;
 }

 function showMessage(text, ok) {
  const messageDiv = document.getElementById("message");
  messageDiv.textContent = text;
  messageDiv.className = ok ? "success" : "error";
 }

 function errorDetail(error) {
  if (!error) {
   return "Неизвестная ошибка";
  }
  if (typeof error.detail === "string") {
   return error.detail;
  }
  if (Array.isArray(error.detail)) {
   return error.detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
  }
  return error.detail || "Неизвестная ошибка";
 }

 function authHeaders() {
  const headers = { "Content-Type": "application/json" };
  const token = localStorage.getItem(TOKEN_KEY);
  if (token) {
   headers.Authorization = "Bearer " + token;
  }
  return headers;
 }

 function renderProducts(items) {
  const productsList = document.getElementById("productsList");
  productsList.innerHTML = "";
  if (!items || items.length === 0) {
   productsList.textContent = "Товары не найдены";
   return;
  }
  const ul = document.createElement("ul");
  items.forEach((product) => {
   const stock = product.stock ?? product.quantity;
   const li = document.createElement("li");
   li.textContent = `${product.name} - ${product.price} руб. (остаток: ${stock})`;
   ul.appendChild(li);
  });
  productsList.appendChild(ul);
 }

 async function loadProducts() {
  const productsList = document.getElementById("productsList");
  try {
   const response = await fetch(apiUrl("/api/v1/products"));
   if (!response.ok) {
    productsList.textContent = "Ошибка при получении товаров";
    return;
   }
   const data = await response.json();
   const items = Array.isArray(data) ? data : (data.products || data.data || []);
   renderProducts(items);
  } catch (error) {
   productsList.textContent = `Ошибка: ${error.message}`;
  }
 }

 document.getElementById("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  try {
   const response = await fetch(apiUrl("/api/v1/login"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
     username: document.getElementById("username").value,
     password: document.getElementById("password").value
    })
   });
   const result = await response.json();
   if (response.ok) {
    localStorage.setItem(TOKEN_KEY, result.access_token);
    showMessage("Токен получен, можно добавлять товары", true);
   } else {
    showMessage("Ошибка входа: " + errorDetail(result), false);
   }
  } catch (error) {
   showMessage("Ошибка подключения: " + error.message, false);
  }
 });

 document.getElementById("productForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  const formData = {
   name: document.getElementById("name").value,
   price: parseFloat(document.getElementById("price").value),
   stock: parseInt(document.getElementById("stock").value, 10)
  };
  try {
   const response = await fetch(apiUrl("/api/v1/products"), {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify(formData)
   });
   const result = await response.json();
   if (response.ok) {
    showMessage("Товар успешно создан! ID: " + result.id, true);
    document.getElementById("productForm").reset();
    await loadProducts();
   } else {
    showMessage("Ошибка: " + errorDetail(result), false);
   }
  } catch (error) {
   showMessage("Ошибка подключения: " + error.message, false);
  }
 });

 document.getElementById("getProductsBtn").addEventListener("click", loadProducts);
 loadProducts();
 </script>
</body>
</html>
